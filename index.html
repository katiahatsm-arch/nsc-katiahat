<script>
let db=null,me=null,tab='home',cur=null,imgs={},users=[],forms=[];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UK=[...'users'],FK='forms';
const LOAD=[['light','লাইট / আলো (Light)'],['fan','পাখা (Fan)'],['tvfp','টিভি / ফ্রিজ / পাম্প (TV/Fridge/Pump)'],['oth','অন্যান্য (Others)']];
const S3=[['p3a','নতুন সংযোগ নিকটতম পোলে সম্ভব? (Feasible from nearest pole)'],['p3b','বিদ্যমান Consumer ID আছে? (Existing Consumer ID)'],['p3c','একই ঠিকানায় অন্য সংযোগ আছে? (Other connection at premises)']];
const S4=[['p4a','আবেদনকারী মালিক/বৈধ দখলদার? (Owner / lawful occupant)'],['p4b','মালিকানার কাগজ আছে? (Ownership document)'],['p4c','NOC আছে? (NOC available)'],['p4d','নিজ নামে সংযোগ চলছে? (Connection in applicant name)']];
const S5=[['p5a','পোল থেকে দূরত্ব অনুমোদিত সীমার মধ্যে? (Distance within limit)'],['p5b','আর্থিং (Earthing) এর ব্যবস্থা আছে কিনা?'],['p5c','মিটার বসানোর উপযুক্ত জায়গা? (Meter location suitable)'],['p5d','রাস্তা/সরকারি জমিতে বাধা নেই? (No obstruction)']];
const blank=()=>({hdr:{type:'Domestic',area:'Rural',ccc:'KATIAHAT'},a:{},load:{},ld:{},c:{},rem:'',sk:{},ag:{},ap:{}});

async function init(){
 try{await Promise.race([window.fbReady,new Promise((_,j)=>setTimeout(()=>j(1),20000))])}catch(e){}
 if(window.FB_CONFIG_MISSING){$('#app').innerHTML='<div class="card err">firebaseConfig বসানো হয়নি। index.html ফাইলে আপনার Firebase config বসান (SETUP_GUIDE দেখুন)।</div>';return}
 if(!window.FB){$('#app').innerHTML='<div class="card err">Firebase লোড হয়নি। Internet ও config চেক করুন। '+esc(window.FB_ERR||'')+'</div>';return}
 db=FB.db;
 try{window.NEEDSETUP=!(await db.doc('meta/setup').get()).exists}catch(e){window.NEEDSETUP=false}
 FB.auth.onChange(async m=>{if(window.SETUPING)return;me=null;if(m){try{const d=await db.doc('users/'+m).get();if(d.exists&&d.data().active!==false)me={...JSON.parse(JSON.stringify(d.data())),mobile:m}}catch(e){}
  if(!me){window.LERR='এই অ্যাকাউন্ট চালু নেই বা Admin প্রোফাইল বানায়নি। Admin-কে জানান।';try{await FB.auth.signOut()}catch(e){}return}}
  window.LERR='';tab='home';render()});
}
async function loadUsers(){users=(await db.collection('users').get()).docs.map(d=>d.data())}
async function loadForms(){const r=ST()?await db.collection(FK).get():me.role==='cfo'?await db.where(FK,'status','==','submitted'):await db.where(FK,'owner','==',me.mobile);
 forms=r.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})).map(f=>LOCAL[f.id]&&(LOCAL[f.id].updated||0)>(f.updated||0)?LOCAL[f.id]:f).sort((a,b)=>(b.updated||0)-(a.updated||0))}
function nav(){
 $('#who').textContent=me?`${me.name} (${me.role})`:'';
 const t=[['home','হোম'],...(me?.role==='agency'||ST()?[['new','নতুন ফর্ম']]:[]),...(ST()?[['users','Users'],['report','Report']]:[]),['track','Track'],['pw','Password']];
 $('#nav').innerHTML=me?t.map(x=>`<button onclick="go('${x[0]}')">${x[1]}</button>`).join(' ')+' <button onclick="logout()">Logout</button>':'';
}
function go(t){tab=t;if(t==='new'){cur={id:null,status:'draft',owner:me.mobile,ownerName:me.name,data:blank()};imgs={}}render()}
function logout(){FB.auth.signOut()}
async function render0(){
 nav();
 if(!me&&window.NEEDSETUP)return setupView();
 if(!me)return $('#app').innerHTML=`<div class="card"><h3>Login</h3><label>Mobile No</label><input id="lm" type="tel" inputmode="numeric" maxlength="10"><label>Password</label><input id="lp" type="password"><div class="bar"><button onclick="login()">Login</button></div><p id="le" class="err">${window.LERR||''}</p></div>`;
 if(tab==='report')return reportView();
 if(tab==='pw')return pwView();
 if(tab==='users'){await loadUsers();return usersView()}
 if(tab==='track')return trackView();
 if(tab==='edit'||tab==='new')return formView();
 if(tab==='prev')return prevView();
 if(tab==='cfo')return cfoView();
 await loadForms();
 const mine0=me.role==='agency'?forms.filter(f=>f.owner===me.mobile):me.role==='cfo'?forms.filter(f=>f.status==='submitted'):forms;let mine=mine0,tabs='';if(me.role!=='agency'){const cmp=f=>f.master==='Complete'&&f.appNo,nc=mine0.filter(cmp).length;mine=mine0.filter(f=>htab==='complete'?cmp(f):!cmp(f));tabs=`<div class="bar"><button class="${htab==='pending'?'':'g'}" onclick="htab='pending';render()">Pending (${mine0.length-nc})</button><button class="${htab==='complete'?'s':'g'}" onclick="htab='complete';render()">Complete (${nc})</button></div>`}setTimeout(()=>hook(mine),0);
 $('#app').innerHTML=`<div class="card"><h3>${me.role==='agency'?'আমার রেকর্ড':'সব রেকর্ড'} (${mine.length})</h3>${tabs}${mine.length?listTbl(mine):'<p>কোনো রেকর্ড নেই।</p>'}</div>`;
}
function listTbl(a){return `<div class="sc"><table><tr><th>Date</th><th>Applicant</th><th>App No</th><th>Status</th><th>Master Card</th>${me.role!=='agency'?'<th>Agency</th>':''}<th></th></tr>${a.map(f=>`<tr><td>${esc(f.data.hdr.idate||'')}</td><td>${esc(f.data.a.name||'-')}</td><td>${esc(f.appNo||'-')}</td><td><span class="tag ${f.status}">${f.status}</span></td><td>${f.master?`<span class="tag ${f.master}">${f.master}</span>`:'-'}</td>${me.role!=='agency'?`<td>${esc(f.ownerName)}</td>`:''}<td>${((f.status==='draft'||f.status==='returned')&&f.owner===me.mobile)||ST()?`<button class="g" onclick="open_('${f.id}','edit')">Edit</button>`:''} <button class="g" onclick="open_('${f.id}','prev')">দেখুন</button>${(me.role==='cfo'&&f.status==='submitted'&&!f.cfoDone)||ST()?` <button onclick="open_('${f.id}','cfo')">CFO</button>`:''}${ST()&&(f.status==='submitted'||f.status==='rejected')?` <button class="d" onclick="retForm('${f.id}')">Re-submit</button>`:''}${ST()&&f.status==='submitted'?` <button class="d" onclick="rejForm('${f.id}')">Reject</button>`:''}${me.role==='admin'?` <button class="d" onclick="delForm('${f.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div>`}
async function open_(id,t){let dd=null;try{dd=await db.doc(FK+'/'+id).get()}catch(e){}cur=dd&&dd.exists?{id,...JSON.parse(JSON.stringify(dd.data()))}:JSON.parse(JSON.stringify(forms.find(f=>f.id===id)));cur.data={...blank(),...cur.data};imgs={};for(const k of['1','2']){try{const d=await db.doc('imgs/'+id+'_'+k).get();if(d.exists)imgs[k]=d.data().d}catch(e){}}tab=t;render()}
async function login(){const m=($('#lm').value||'').trim(),p=$('#lp').value;$('#le').textContent='';if(!/^\d{10}$/.test(m)||!p)return $('#le').textContent='১০ সংখ্যার মোবাইল ও password দিন';
 let ver=0,reset=false;try{const g=await db.doc('login/'+m).get();if(g.exists){ver=g.data().ver||0;reset=!!g.data().reset}}catch(e){}
 if(reset){if(p.length<6)return $('#le').textContent='নতুন password কমপক্ষে ৬ অক্ষর দিন';
  if(!await ask('আপনার password reset করা হয়েছে। এখন যে password দিয়েছেন সেটাই নতুন password হবে। নিশ্চিত? (Set this as your new password?)'))return;
  try{await FB.auth.signUp(m,p,ver);try{await db.doc('login/'+m).update({reset:false})}catch(e){}}catch(e){$('#le').textContent='নতুন password সেট হয়নি ('+(e.code||'error')+')'}return}
 try{await FB.auth.signIn(m,p,ver)}catch(e){$('#le').textContent='Mobile বা password ভুল ('+(e.code||'error')+')'}}
/* users */
function uf(r,u={}){return `<div class="row"><div><label>নাম</label><input id="un" value="${esc(u.name)}"></div><div><label>Mobile (10 digit)</label><input id="um" type="tel" maxlength="10" value="${esc(u.mobile)}" ${u.mobile?'readonly':''}></div><div><label>Password ${u.mobile?'(ফাঁকা = অপরিবর্তিত)':''}</label><input id="up" type="text"></div>${r==='adm'?'':`<div><label>Role</label><select id="ur">${(me.role==='admin'?['agency','cfo','officer','admin']:['agency','cfo']).map(x=>`<option ${u.role===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Active</label><select id="ua"><option value="1">Yes</option><option value="0" ${u.active===false?'selected':''}>No</option></select></div>`}</div>`}
async function mkUser(){const n=$('#un').value.trim(),m=$('#um').value.trim(),p=$('#up').value,old=users.find(u=>u.mobile===m);
 if(!n||!/^\d{10}$/.test(m)||(!old&&p.length<6))return alert('নাম, ১০ সংখ্যার মোবাইল ও password (কমপক্ষে ৬ অক্ষর) দিন');
 try{if(!old){try{await FB.auth.createUser(m,p)}catch(e){if(e.code!=='auth/email-already-in-use')throw e}}
  await db.doc('users/'+m).set({name:n,mobile:m,role:$('#ur').value,active:$('#ua').value==='1'});if(!old){try{await db.doc('login/'+m).set({ver:0,reset:false})}catch(e){}}}catch(e){return alert('Failed: '+(e.code||'')+' '+(e.message||e))}
 if(old&&p)alert('Password এখান থেকে বদলানো যায় না। ব্যবহারকারী নিজে "Password" বাটনে বদলাবেন।');
 await loadUsers();tab='users';render()}
function usersView(){const c=r=>users.filter(u=>u.role===r).length,adm=me.role==='admin',can=u=>adm||u.role==='agency'||u.role==='cfo';
 $('#app').innerHTML=`<div class="card"><h3>Users — Agency ${c('agency')}/25 · CFO ${c('cfo')}/2 · Officer ${c('officer')}/3 · Admin ${c('admin')}/6</h3><div class="sc"><table><tr><th>Name</th><th>Mobile</th><th>Role</th><th>Active</th><th></th></tr>${users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.mobile}</td><td>${u.role}</td><td>${u.active===false?'No':'Yes'}</td><td>${can(u)?`<button class="g" onclick="editU('${u.mobile}')">Edit</button>`:''}${adm?` <button class="g" onclick="resetPw('${u.mobile}')">Reset Password</button> <button class="d" onclick="delU('${u.mobile}')">Delete</button>`:''}</td></tr>`).join('')}</table></div></div><div class="card"><h3 id="uh">নতুন User</h3><div id="uform">${uf('x')}</div><div class="bar"><button onclick="saveU()">Save</button></div></div>`}
function editU(m){const u=users.find(x=>x.mobile===m);$('#uform').innerHTML=uf('x',u);$('#uh').textContent='Edit: '+u.name;scrollTo(0,document.body.scrollHeight)}
async function saveU(){const m=$('#um').value.trim(),role=$('#ur').value,old=users.find(u=>u.mobile===m),lim={agency:25,cfo:2,officer:3,admin:6};if(me.role==='officer'&&!['agency','cfo'].includes(role))return alert('Officer শুধু Agency ও CFO user বানাতে পারে');if(me.role==='officer'&&old&&!['agency','cfo'].includes(old.role))return alert('এই user বদলানোর অনুমতি নেই');
 if(!old&&users.filter(u=>u.role===role).length>=lim[role])return alert(role+' limit '+lim[role]+' পূর্ণ');await mkUser(false)}
async function delU(m){if(m===me.mobile)return alert('নিজেকে মোছা যাবে না');if(await ask('মুছবেন?')){await db.doc('users/'+m).delete();try{await db.doc('login/'+m).delete()}catch(e){}await loadUsers();render()}}
/* form */
function yn(k,l,sec){const v=cur.data.c[k]||'';return `<div class="yn"><span>${l}</span><select onchange="cur.data.c['${k}']=this.value;tgl()"><option value="">—</option><option ${v==='Yes'?'selected':''}>Yes</option><option ${v==='No'?'selected':''}>No</option></select></div>`}

 return forms.filter(f=>f.status!=='draft'&&(!a||f.owner===a)&&(!fr||fDate(f)>=fr)&&(!to||fDate(f)<=to)&&(!ty||(f.data.hdr.type||'')===ty)&&(!st||(st==='Complete')===isCmp(f)))
  .sort((x,y)=>fDate(x)<fDate(y)?-1:1).map((f,i)=>[i+1,fDate(f),f.ownerName||'',f.data.a.name||'',f.data.a.mob||'',f.data.hdr.type||'',f.data.hdr.area||'',f.data.ld.applied||'',fmtW(f.data.load.total||0),f.appNo||'',f.master||'',isCmp(f)?'Complete':(f.status==='rejected'?'Rejected':'Pending')])}
async function reportView(){await loadForms();const ags=[...new Map(forms.map(f=>[f.owner,f.ownerName])).entries()];
 $('#app').innerHTML=`<div class="card"><h3>Report (রিপোর্ট)</h3><div class="row"><div><label>Agency</label><select id="ra"><option value="">All</option>${ags.map(([m,n])=>`<option value="${m}">${esc(n)} (${m})</option>`).join('')}</select></div><div><label>Date From</label><input id="rf" type="date"></div><div><label>Date To</label><input id="rt2" type="date"></div><div><label>Type</label><select id="ry"><option value="">All</option>${['Domestic','Commercial','Others'].map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Status</label><select id="rs"><option value="">All</option><option>Pending</option><option>Complete</option></select></div></div><div class="bar"><button onclick="repShow()">Show</button><button class="s" onclick="repXls()">Excel</button><button onclick="repPdf()">PDF</button></div><div id="rr"></div></div>${me.role==='admin'?`<div class="card"><h3>Month-wise Delete (মাস অনুযায়ী মোছা)</h3><p>আগে Excel/PDF নামিয়ে রাখুন। মোছা ফর্ম ফেরত আসে না।</p><div class="row"><div><label>Month</label><input id="dm" type="month"></div><div><label>কোন ফর্ম</label><select id="dk"><option value="c">শুধু Complete</option><option value="a">সব ফর্ম</option></select></div></div><div class="bar"><button class="d" onclick="delMonth()">Delete</button></div></div>`:''}`;repShow()}
function repShow(){const r=repRows(),c=r.filter(x=>x[11]==='Complete').length;$('#rr').innerHTML=`<p>Total: <b>${r.length}</b> · Complete: <b>${c}</b> · Pending/Other: <b>${r.length-c}</b></p><div class="sc"><table><tr>${RCOLS.map(x=>`<th>${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></div>`}
function repXls(){if(!window.XLSX)return alert('Excel library load হয়নি। Internet চেক করুন।');const r=repRows(),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([RCOLS,...r]),'Report');XLSX.writeFile(wb,'NSC_Report_'+new Date().toISOString().slice(0,10)+'.xlsx')}
async function repPdf(){try{if(!window.html2canvas||!window.jspdf)return alert('PDF library load হয়নি। Internet চেক করুন।');const r=repRows(),c=r.filter(x=>x[11]==='Complete').length;
 const w=document.createElement('div');w.style.cssText='position:fixed;left:-9999px;top:0;width:1123px;background:#fff;color:#000;padding:20px;font:12px Arial,sans-serif';
 w.innerHTML=`<h3 style="margin:0 0 4px">WBSEDCL — NSC Inspection Report (KATIAHAT)</h3><div style="margin-bottom:8px">Generated: ${new Date().toLocaleString()} · Total ${r.length} · Complete ${c} · Pending/Other ${r.length-c}</div><table id="rpt" style="border-collapse:collapse;width:100%"><tr>${RCOLS.map(x=>`<th style="border:1px solid #444;padding:3px 5px;background:#e6e6e6;text-align:left">${x}</th>`).join('')}</tr>${r.map(x=>`<tr>${x.map(v=>`<td style="border:1px solid #444;padding:3px 5px">${esc(v)}</td>`).join('')}</tr>`).join('')}</table>`;
 document.body.appendChild(w);const cv=await html2canvas(w,{scale:2,backgroundColor:'#fff'});const bt=[...w.querySelectorAll('tr')].map(t=>t.offsetTop+t.offsetHeight),H=w.scrollHeight;w.remove();
 const pdf=new window.jspdf.jsPDF({orientation:'l',unit:'mm',format:'a4'}),ph=1123*210/297;let y0=0,first=true;
 while(y0<H-1){let t=y0+ph,b=Math.max(...bt.filter(v=>v<=t&&v>y0),0);if(H<=t)b=H;else if(!b)b=t;
  const sc=document.createElement('canvas');sc.width=cv.width;sc.height=Math.round((b-y0)*2);sc.getContext('2d').drawImage(cv,0,y0*2,cv.width,sc.height,0,0,cv.width,sc.height);
  if(!first)pdf.addPage();first=false;pdf.addImage(sc.toDataURL('image/jpeg',.9),'JPEG',0,0,297,(b-y0)*297/1123);y0=b}
 pdf.save('NSC_Report_'+new Date().toISOString().slice(0,10)+'.pdf')}catch(e){alert('PDF ব্যর্থ: '+(e&&e.message||e))}}
async function delMonth(){const ym=$('#dm').value;if(!ym)return alert('মাস বাছুন');const onlyC=$('#dk').value==='c',list=forms.filter(f=>fDate(f).slice(0,7)===ym&&(!onlyC||isCmp(f)));
 if(!list.length)return alert('এই মাসে কোনো ফর্ম নেই');if(!await ask(ym+' মাসের '+list.length+'টি ফর্ম (ও ছবি) স্থায়ীভাবে মুছে যাবে। Excel/PDF নামিয়ে রেখেছেন? নিশ্চিত?'))return;
 let n=0;try{for(const f of list){await db.doc(FK+'/'+f.id).delete();for(const k of['1','2']){try{await db.doc('imgs/'+f.id+'_'+k).delete()}catch(e){}}delete LOCAL[f.id];n++}}catch(e){alert('মাঝপথে ব্যর্থ ('+n+'টি মোছা হয়েছে): '+(e.code||'')+' '+(e.message||e))}
 alert('✔ '+n+'টি ফর্ম মোছা হয়েছে');render()}

function normMob(s){s=String(s||'').replace(/[Oo]/g,'0').replace(/[০-৯]/g,c=>c.charCodeAt(0)-0x9e6).replace(/\D/g,'');if(s.length===12&&s.startsWith('91'))s=s.slice(2);else if(s.length===11&&s[0]==='0')s=s.slice(1);return s}
function validate(){document.querySelectorAll('input[id^="f_"]').forEach(i=>{const p=i.id.split('_');if(cur.data[p[1]])cur.data[p[1]][p[2]]=i.style.textTransform==='uppercase'?i.value.toUpperCase():i.value});const d=cur.data,m=[],e=(v,n)=>{if(v===undefined||v===null||String(v).trim()==='')m.push(n)};
[['dtr','DTR Code'],['cap','DTR Capacity'],['idate','Inspection Date'],['zone','Zone']].forEach(([k,n])=>e(d.hdr[k],n));
[['name','Name'],['father','Father/Husband'],['addr','Address']].forEach(([k,n])=>e(d.a[k],n));
const mb=normMob(d.a.mob);if(/^[6-9]\d{9}$/.test(mb))d.a.mob=mb;else m.push('Mobile: "'+(d.a.mob||'')+'" — ভারতীয় মোবাইল নং লিখুন (০ বা +91 ছাড়া ১০ সংখ্যা, 6-9 দিয়ে শুরু)');
e(d.ld.applied,'Applied Load');LOAD.forEach(([k,l])=>{e(d.load[k+'q'],l+' Qty');e(d.load[k+'w'],l+' Watt')});
[['match','Total matches Applied Load'],...S3,...S4,...S5].forEach(([k,l])=>e(d.c[k],l));
d.sk=d.sk||{};e(d.sk.dist,'Sketch: Distance Pole-House (m)');e(d.sk.type,'Sketch: House Type (Pakka/Kaccha)');e(d.sk.kind,'Sketch: Old / New House');if(d.sk.dist&&!/^\d+(\.\d+)?$/.test(String(d.sk.dist).trim()))m.push('Distance: number only');e(d.rem,'Remarks');e(d.ag.name,'Agency Rep Name');e(d.ag.date,'Agency Rep Date');const dg=x=>String(x||'').replace(/[Oo]/g,'0').replace(/[০-৯]/g,c=>c.charCodeAt(0)-0x9e6).replace(/\D/g,'');if(d.c.p3b==='Yes'){d.a.cid=dg(d.a.cid);e(d.a.cid,'Consumer ID')}else d.a.cid='';d.hdr.cap=dg(d.hdr.cap)||d.hdr.cap;const rx=(v,r,n)=>{if(v!==undefined&&String(v).trim()!==''&&!r.test(String(v).trim()))m.push(n)};rx(d.hdr.dtr,/^[A-Za-z0-9]{5}$/,'DTR Code: 5 character (letters/digits)');rx(d.hdr.cap,/^\d{2,3}$/,'DTR Capacity: 2-3 digit number');rx(d.hdr.zone,/^[A-Za-z0-9]{3}$/,'Zone: 3 character (letters/digits)');if(d.c.p3b==='Yes')rx(d.a.cid,/^\d+$/,'Consumer ID: numeric only');rx(d.ld.applied,/^\d+(\.\d+)?$/,'Applied Load: number only');LOAD.forEach(([k,l])=>{rx(d.load[k+'q'],/^\d+$/,l+' Qty: number only');rx(d.load[k+'w'],/^\d+(\.\d+)?$/,l+' Watt: number only')});d.ap.name=d.a.name;
if(!imgs[1])m.push('Inspection Image');if(!imgs[2])m.push('Agency Representative Image');return m}

 <h4>১. আবেদনকারীর বিবরণ (Applicant Details)</h4><table><tr><td>নাম (Name)</td><td class="v">${esc(d.a.name)}</td></tr><tr><td>পিতা/স্বামীর নাম (Father/Husband)</td><td class="v">${esc(d.a.father)}</td></tr><tr><td>ঠিকানা (Address)</td><td class="v">${esc(d.a.addr)}</td></tr><tr><td>মোবাইল (Mobile)</td><td class="v">${esc(d.a.mob)}</td></tr></table>

 <h4>৩. প্রস্তাবিত সংযোগ (Proposed Connection)</h4><table>${S3.map(([k,l])=>Y(l,k)).join('')}<tr><td>পোল নং / Consumer ID (Pole No)</td><td class="v">${d.c.p3b==='Yes'?'Consumer ID: '+esc(d.a.cid)+' / ':''}Pole: ${esc(d.a.pole)}</td></tr></table>

 <h4>৬. পরিদর্শনের নকশা (Inspection Sketch)</h4><div style="border:1px solid #444;padding:2px">${skSVG(d.sk||{})}</div><h4>৭. মন্তব্য (Remarks)</h4><div style="border:1px solid #444;min-height:55px;padding:6px;font-size:12px;white-space:pre-wrap">${esc(d.rem)}</div>
