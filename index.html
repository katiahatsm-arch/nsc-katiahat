 if(!window.FB){$('#app').innerHTML='<div class="card err">Firebase লোড হয়নি। Internet ও config চেক করুন। '+esc(window.FB_ERR||'')+'</div>';return}
 db=FB.db;
 try{window.NEEDSETUP=!(await db.doc('meta/setup').get()).exists}catch(e){window.NEEDSETUP=false}
 FB.auth.onChange(async m=>{if(window.SETUPING)return;if(!m)clearInterval(PT);me=null;if(m){try{const d=await db.doc('users/'+m).get();if(d.exists){const u={...JSON.parse(JSON.stringify(d.data())),mobile:m};let pt0=0;try{const pr=await db.doc('presence/'+m).get();if(pr.exists)pt0=pr.data().t||0}catch(e){}const bt=Math.max(u.since||0,pt0),exp=u.role==='agency'&&bt>0&&Date.now()-bt>15*864e5;if(u.active!==false&&!exp)me=u}}catch(e){}
  if(!me){window.LERR='আপনার অ্যাকাউন্ট In-active। ১৫ দিনের বেশি লগইন না করলে বা Admin/Officer বন্ধ করলে এমন হয়। অনুগ্রহ করে Officer বা Admin-এর সাথে যোগাযোগ করুন।';try{await FB.auth.signOut()}catch(e){}return}}
  window.LERR='';tab='home';render();startPresence()});

function listTbl(a){return `<div class="sc"><table><tr><th>Date</th><th>Applicant</th><th>App No</th><th>Status</th><th>Master Card</th><th>Agency</th><th>Inspection Image</th><th>Agency Rep.</th><th>Submit Date / Last Modify</th><th></th></tr>${a.map(f=>`<tr style="${rowBg(f)}"><td>${esc(f.data.hdr.idate||'')}</td><td>${esc(f.data.a.name||'-')}</td><td>${esc(f.appNo||'-')}</td><td>${emo(f)}<span class="tag ${f.status}">${f.status}</span></td><td>${f.master?`<span class="tag ${f.master}">${f.master}</span>`:'-'}</td><td>${esc(f.ownerName)}</td><td>${imgCell(f,1)}</td><td>${imgCell(f,2)}</td><td style="white-space:nowrap;font-size:12px">S: ${fmtDT(f.submittedAt)}<br>M: ${fmtDT(f.updated)}</td><td>${((f.status==='draft'||f.status==='returned')&&f.owner===me.mobile)||CAN(f)?`<button class="g" onclick="open_('${f.id}','edit')">Edit</button>`:''} <button class="g" onclick="open_('${f.id}','prev')">দেখুন</button>${(me.role==='cfo'&&f.status==='submitted'&&!f.cfoDone)||CAN(f)?` <button onclick="open_('${f.id}','cfo')">CFO</button>`:''}${CAN(f)&&f.status==='submitted'?` <button class="d" onclick="retForm('${f.id}')">Re-submit</button>`:''}${ST()&&f.status==='submitted'?` <button class="d" onclick="rejForm('${f.id}')">Reject</button>`:''}${me.role==='admin'&&f.status==='rejected'?` <button class="s" onclick="reopen('${f.id}')">Reopen</button>`:''}${me.role==='admin'?` <button class="d" onclick="delForm('${f.id}')">Delete</button>`:''}</td></tr>`).join('')}</table></div>`}

for(let x=6;x<400;x+=14)o+=`<path d="M${x} 125l-5 6" stroke-width=".8"/>`;
o+='<path d="M40 125V18M24 28H56M30 38H50" stroke-width="3"/><circle cx="26" cy="26" r="2" fill="#000"/><circle cx="54" cy="26" r="2" fill="#000"/>';
o+=`<path d="M54 28Q${(54+hx)/2} 54 ${hx} ${top+8}"/><path d="M46 38Q${(46+hx)/2} 64 ${hx} ${top+16}"/>`;
const hs=nw?[[hx,'New'],[hx+w+30,'Old']]:[[hx,k.kind==='Old'?'Old House':'House']];let lb='';
hs.forEach(([x,t])=>{const r=x+w;o+=`<rect x="${x}" y="${top}" width="${w}" height="${H}" fill="#fff"/>`;
 if(pk){o+=`<path d="M${x-4} ${top}H${r+4}" stroke-width="3"/>`;for(let y=top+8;y<125;y+=9)o+=`<path d="M${x} ${y}H${r}" stroke-width=".4"/>`}
 else{o+=`<path d="M${x-8} ${top}L${x+w/2} ${top-26}L${r+8} ${top}Z" fill="#fff"/>`;for(let q=x+10;q<r;q+=12)o+=`<path d="M${q} ${top-3}L${x+w/2+(q-x-w/2)*.2} ${top-23}" stroke-width=".6"/>`}
 o+=`<rect x="${r-30}" y="99" width="16" height="26"/><rect x="${x+12}" y="99" width="20" height="14"/>`;
 lb+=`<text x="${x+w/2}" y="${top-(pk?8:30)}" text-anchor="middle" font-weight="bold">${t}${k.type?' · '+(pk?'Pakka':'Kaccha'):''}</text>`});
o+=`<rect x="${hx-8}" y="${top+20}" width="8" height="12" fill="#000"/>`;
o+=`<path d="M40 142H${hx}M40 137V147M${hx} 137V147"/></g><g fill="#000" stroke="none"><text x="40" y="12" text-anchor="middle" font-weight="bold">POLE</text><text x="${(40+hx)/2}" y="139" text-anchor="middle">${dist||'?'} m</text>${lb}</g></svg>`;

 const pdf=new window.jspdf.jsPDF({orientation:'l',unit:'mm',format:'a4'}),ph=1123*210/297;let y0=0,first=true;

/* CFO */
function cfoView(){if(me.role==='cfo'&&cur.cfoDone){alert('Master Card Complete হয়ে গেছে। শুধু Admin edit করতে পারবে।');tab='home';return render()}$('#app').innerHTML=`<div class="card"><h3>CFO: ${esc(cur.data.a.name)}</h3><label>Application No (10 digit, numeric)</label><input id="can" value="${esc(cur.appNo)}" maxlength="10" inputmode="numeric" type="tel"><label>Master Card</label><select id="cmc">${['','Complete','Pending'].map(x=>`<option ${cur.master===x?'selected':''}>${x}</option>`).join('')}</select><div class="bar"><button class="s" onclick="cfoSave()">Submit</button><button class="g" onclick="tab='prev';render()">Preview</button><button class="g" onclick="tab='home';render()">Back</button></div></div>`}
async function cfoSave(){const a=($('#can').value||'').replace(/\D/g,''),m=$('#cmc').value;if(!/^\d{10}$/.test(a))return alert('Application No ১০ সংখ্যার হতে হবে (must be 10 digits)');if(!m)return alert('Master Card status দিন (Complete / Pending)');if(me.role==='cfo'&&m==='Complete'&&!await ask('Master Card "Complete" দিলে CFO আর edit করতে পারবে না (শুধু Admin পারবে)। নিশ্চিত?'))return;await db.doc(FK+'/'+cur.id).update({appNo:a,master:m,cfoDone:m==='Complete',updated:Date.now()});await refresh(cur.id);alert('Saved');tab='home';render()}
/* track */
async function trackView(){await loadForms();$('#app').innerHTML=`<div class="card"><h3>Track</h3><input id="tq" placeholder="Application No বা মোবাইল নম্বর (Mobile)"><div class="bar"><button onclick="doTrack()">Search</button></div><div id="tr"></div></div>`;doTrack(1)}
function doTrack(all){const q=($('#tq')?.value||'').trim();let a=me.role==='agency'?forms.filter(f=>f.owner===me.mobile):me.role==='cfo'?forms.filter(f=>f.status==='submitted'):forms;if(q)a=a.filter(f=>(f.appNo||'')===q||(f.data.a.mob||'').includes(q));$('#tr').innerHTML=a.length?listTbl(a):'<p>পাওয়া যায়নি।</p>'}
function fit1(on){document.querySelectorAll('.fit').forEach(e=>{e.style.zoom=1;if(on){const h=e.scrollHeight,m=281*3.7795-6;if(h>m)e.style.zoom=(m/h).toFixed(3)}})}
addEventListener('beforeprint',()=>fit1(true));addEventListener('afterprint',()=>fit1(false));
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
init();
</script></body></html>
